# معجم مصطلحات مشروع ص — مصدر الحقيقة (دليل الأسلوب، القاعدتان ١٢ و٢٧)
#
# يُلزم كل نص عربي في المشروع: تعليقات الشفرة، ورسائل المستخدم، والتوثيق.
# والمصطلح الجديد يضاف هنا قبل استعماله.
#
# صيغة كل مدخل:
#   [term.<id>]      المعرّف الإنجليزي ثابت لا يتغير ولا يعاد استعماله (القاعدة ٤٧)
#   ar      = المصطلح العربي الوحيد المعتمد
#   en      = مقابله الإنجليزي
#   banned  = مرادفات عربية يرفضها السكربت
#   note    = (اختياري) حدّ المعنى أو ما يفرّقه عن مصطلح قريب
#   status  = "approved" أو "proposed" (المقترح لا يُفرض حتى يعتمده المالك)
#
# المطابقة: المحظور يُطابَق كلمةً كاملة (أو عبارةً كاملة)، ولو سبقته «ال» أو حروف العطف والجر (و ف ب ك ل)،
# وتتجاهل التشكيل، وتوحّد الهمزة كما في ك‑١. فالمصطلح يُكتب هنا بلا تشكيل.
# ويُستثنى من المطابقة: ما بين «» من كلام المالك المنقول، والسجلّات (مراجعات/).
# ولا يُحظر إلا ما لا يحمل في المشروع معنى آخر؛ فالكلمات العامة لا تُحظر مفردةً.
# والنص NFC، بلا محارف تحكم بالاتجاه ولا محارف خفية (القاعدة ٤٨).
# والمصطلح الإنجليزي بين قوسين بعد العربي مسموح في أول ذكر، ولا يغني عنه.

